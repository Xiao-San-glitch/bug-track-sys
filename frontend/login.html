<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugTracker Pro - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo-center">
                <div class="logo-text">
                    <h1>BugTracker Pro</h1>
                </div>
            </div>
            
            <form id="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="error-message" style="color: var(--red); font-size: 12px; margin-bottom: 10px; display: none;"></div>
                
                <button type="submit" id="submit-btn" class="btn-primary w-100 mt-4">Sign In</button>
            </form>
            <p style="text-align:center; margin-top: 15px; font-size: 13px;">
                <span id="toggle-text">Don't have an account?</span> 
                <a href="#" id="toggle-mode" style="color: var(--blue); text-decoration: none; font-weight: 600;">Sign Up</a>
            </p>
            <p style="text-align:center; margin-top: 15px;">
                <a href="index.html" class="btn-secondary">Back to Homepage</a>
            </p>
        </div>
    </div>
</body>
<script>
    let isLogin = true;
    const toggleBtn = document.getElementById('toggle-mode');
    const toggleText = document.getElementById('toggle-text');
    const submitBtn = document.getElementById('submit-btn');
    
    toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        if (isLogin) {
            submitBtn.textContent = 'Sign In';
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = 'Sign Up';
        } else {
            submitBtn.textContent = 'Sign Up';
            toggleText.textContent = "Already have an account?";
            toggleBtn.textContent = 'Sign In';
        }
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        
        const endpoint = isLogin ? '/api/login' : '/api/signup';
        
        try {
            const response = await fetch(`http://localhost:5002${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                if (isLogin) {
                    localStorage.setItem('userEmail', data.email);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Sign up successful! You can now log in.');
                    isLogin = true;
                    submitBtn.textContent = 'Sign In';
                    toggleText.textContent = "Don't have an account?";
                    toggleBtn.textContent = 'Sign Up';
                    errorDiv.style.display = 'none';
                }
            } else {
                errorDiv.textContent = data.message || 'Authentication failed';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'Server error. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</html>
