<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugTracker Pro - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo-center">
                <div class="logo-text">
                    <h1>BugTracker Pro</h1>
                </div>
            </div>
            
            <form id="auth-form">
                <div class="form-group" id="name-group" style="display: none;">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="error-message" style="color: var(--red); font-size: 12px; margin-bottom: 10px; display: none;"></div>
                
                <button type="submit" id="submit-btn" class="btn-primary w-100 mt-4">Sign In</button>
            </form>
            <p style="text-align:center; margin-top: 15px; font-size: 13px;">
                <span id="toggle-text">Don't have an account?</span> 
                <a href="#" id="toggle-mode" style="color: var(--blue); text-decoration: none; font-weight: 600;">Sign Up</a>
            </p>
            <p style="text-align:center; margin-top: 15px;">
                <a href="index.html" class="btn-secondary">Back to Homepage</a>
            </p>
        </div>
    </div>
</body>
<script src="/js/api.js"></script>
<script>
    let isLogin = true;
    const toggleBtn = document.getElementById('toggle-mode');
    const toggleText = document.getElementById('toggle-text');
    const submitBtn = document.getElementById('submit-btn');
    
    toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        const nameGroup = document.getElementById('name-group');
        const nameInput = document.getElementById('name');
        
        if (isLogin) {
            submitBtn.textContent = 'Sign In';
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = 'Sign Up';
            nameGroup.style.display = 'none';
            nameInput.removeAttribute('required');
        } else {
            submitBtn.textContent = 'Sign Up';
            toggleText.textContent = "Already have an account?";
            toggleBtn.textContent = 'Sign In';
            nameGroup.style.display = 'block';
            nameInput.setAttribute('required', 'true');
        }
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;
        const errorDiv = document.getElementById('error-message');
        
        const endpoint = isLogin ? '/auth/login' : '/auth/register';
        const body = isLogin ? { email, password } : { name, email, password };
        
        try {
            const { response, data } = await fetchWithAuth(endpoint, {
                method: 'POST',
                body: JSON.stringify(body)
            });
            
            if (response.ok && data.success) {
                if (isLogin) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                }
            } else {
                errorDiv.textContent = data.message || 'Authentication failed';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'Server error. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</html>
